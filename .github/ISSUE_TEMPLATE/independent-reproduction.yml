name: External source-tree reproduction
description: Report a self-declared external run of the pinned synthetic workflow.
title: "[reproduction]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a source-tree test. This report is self-declared and attributed to your GitHub account; it does not by itself authenticate identity, independence, a packaged release, or a scientific result. The current pilot tests only engine commit 1995cf7379523c952dc19f56fdc01b15a9212583; packaged release v0.1.0a2 is explicitly excluded because it is not aligned with the current source-tree example or guide. Use only public or synthetic data. Remove credentials, private paths, patient information, and restricted material before submitting.
  - type: input
    id: guide_revision
    attributes:
      label: Exact guide revision
      description: Full Git commit SHA containing the instructions you followed.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: input
    id: guide_sha256
    attributes:
      label: Guide SHA-256
      description: Independently computed digest of docs/independent-reproduction.md; it must match the source-freeze row at the guide revision.
      placeholder: 64-character SHA-256
    validations:
      required: true
  - type: input
    id: engine_revision
    attributes:
      label: Exact engine revision
      description: Full Git commit SHA of the engine worktree tested; the current pilot requires 1995cf7379523c952dc19f56fdc01b15a9212583 and does not accept release v0.1.0a2.
      placeholder: 1995cf7379523c952dc19f56fdc01b15a9212583
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Python version, uv version, and installation method.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Paste the exact commands, every exit status, and all named values from the guide's golden software-output contract.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Completed without undocumented changes
        - Completed after an undocumented workaround
        - Did not complete
    validations:
      required: true
  - type: input
    id: elapsed
    attributes:
      label: Elapsed setup and run time
      placeholder: e.g. 18 minutes
    validations:
      required: true
  - type: textarea
    id: first_failure
    attributes:
      label: First failure or ambiguity
      description: Give the first unexpected output or unclear instruction. Write “none” only if there was none.
    validations:
      required: true
  - type: textarea
    id: interpretation
    attributes:
      label: Your interpretation
      description: In your own words, what does the output establish, and what does it not establish?
    validations:
      required: true
  - type: textarea
    id: relationship
    attributes:
      label: Prior project involvement or conflicts
      description: State any prior contribution, collaboration, employment, supervision, author assistance, or other relationship with the maintainer. Write “none declared” if none.
    validations:
      required: true
  - type: checkboxes
    id: independence
    attributes:
      label: Independence and data boundary
      options:
        - label: I did not author or contribute to either recorded guide or engine revision, and no maintainer gave me individualized assistance or directed my run beyond the recorded public instructions.
          required: true
        - label: I used no patient-level, private, restricted, or wet-lab data.
          required: true
        - label: I understand this is a self-declared source-tree report; maintainers have not authenticated my identity or independence.
          required: true
        - label: I understand this public issue is an attributable, self-declared source-tree usability report. It is not independent validation, release reproduction, or scientific reproduction.
          required: true
