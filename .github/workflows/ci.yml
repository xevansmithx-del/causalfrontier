name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Test without network access
        run: >-
          uv run --frozen --no-sync pytest
          --disable-socket --allow-unix-socket
          --cov=causalfrontier --cov-report=term-missing --cov-fail-under=80
      - name: Compile source and tests
        run: uv run --frozen --no-sync python -m compileall -q src tests
      - name: Replay neutral boundary on supported runtime
        run: |
          neutral_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/neutral_optimized_probe.py)
          neutral_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/neutral_optimized_probe.py)
          test "$neutral_normal" = "$neutral_optimized"
          registry_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/registry_optimized_probe.py)
          registry_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/registry_optimized_probe.py)
          test "$registry_normal" = "$registry_optimized"
          claim_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/claim_optimized_probe.py)
          claim_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/claim_optimized_probe.py)
          test "$claim_normal" = "$claim_optimized"
          sentinel_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/sentinel_optimized_probe.py)
          sentinel_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/sentinel_optimized_probe.py)
          test "$sentinel_normal" = "$sentinel_optimized"
          witness_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/witness_optimized_probe.py)
          witness_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/witness_optimized_probe.py)
          test "$witness_normal" = "$witness_optimized"
          phase_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/phase_optimized_probe.py)
          phase_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/phase_optimized_probe.py)
          test "$phase_normal" = "$phase_optimized"
          continuity_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/continuity_optimized_probe.py)
          continuity_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/continuity_optimized_probe.py)
          test "$continuity_normal" = "$continuity_optimized"
          calibration_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/calibration_optimized_probe.py)
          calibration_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/calibration_optimized_probe.py)
          test "$calibration_normal" = "$calibration_optimized"
          calibration_v2_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/calibration_v2_optimized_probe.py)
          calibration_v2_optimized=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/calibration_v2_optimized_probe.py)
          test "$calibration_v2_normal" = "$calibration_v2_optimized"

  quality:
    name: Release and trust-boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Lint, format, hooks, and privacy
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync ruff format --check .
          uv run --frozen --no-sync pre-commit run --all-files
          uv run --frozen --no-sync python .github/scripts/privacy_scan.py .
      - name: Replay optimized-runtime boundary
        run: |
          normal=$(uv run --frozen --no-sync python tests/optimized_probe.py)
          optimized=$(uv run --frozen --no-sync python -O tests/optimized_probe.py)
          test "$normal" = "$optimized"
          challenge_normal=$(uv run --frozen --no-sync python tests/challenge_optimized_probe.py)
          challenge_optimized=$(uv run --frozen --no-sync python -O tests/challenge_optimized_probe.py)
          test "$challenge_normal" = "$challenge_optimized"
          protocol_normal=$(uv run --frozen --no-sync python tests/protocol_optimized_probe.py)
          protocol_optimized=$(uv run --frozen --no-sync python -O tests/protocol_optimized_probe.py)
          test "$protocol_normal" = "$protocol_optimized"
          blind_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/blind_optimized_probe.py)
          blind_optimized=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/blind_optimized_probe.py)
          test "$blind_normal" = "$blind_optimized"
          horse_normal=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/horse_race_optimized_probe.py)
          horse_optimized=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/horse_race_optimized_probe.py)
          test "$horse_normal" = "$horse_optimized"
          neutral_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/neutral_optimized_probe.py)
          neutral_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/neutral_optimized_probe.py)
          neutral_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/neutral_optimized_probe.py)
          neutral_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/neutral_optimized_probe.py)
          test "$neutral_normal_hash1" = "$neutral_normal_hash77"
          test "$neutral_normal_hash1" = "$neutral_optimized_hash1"
          test "$neutral_normal_hash1" = "$neutral_optimized_hash77"
          registry_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/registry_optimized_probe.py)
          registry_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/registry_optimized_probe.py)
          registry_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/registry_optimized_probe.py)
          registry_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/registry_optimized_probe.py)
          test "$registry_normal_hash1" = "$registry_normal_hash77"
          test "$registry_normal_hash1" = "$registry_optimized_hash1"
          test "$registry_normal_hash1" = "$registry_optimized_hash77"
          claim_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/claim_optimized_probe.py)
          claim_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/claim_optimized_probe.py)
          claim_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/claim_optimized_probe.py)
          claim_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/claim_optimized_probe.py)
          test "$claim_normal_hash1" = "$claim_normal_hash77"
          test "$claim_normal_hash1" = "$claim_optimized_hash1"
          test "$claim_normal_hash1" = "$claim_optimized_hash77"
          sentinel_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/sentinel_optimized_probe.py)
          sentinel_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/sentinel_optimized_probe.py)
          sentinel_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/sentinel_optimized_probe.py)
          sentinel_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/sentinel_optimized_probe.py)
          test "$sentinel_normal_hash1" = "$sentinel_normal_hash77"
          test "$sentinel_normal_hash1" = "$sentinel_optimized_hash1"
          test "$sentinel_normal_hash1" = "$sentinel_optimized_hash77"
          witness_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/witness_optimized_probe.py)
          witness_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/witness_optimized_probe.py)
          witness_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/witness_optimized_probe.py)
          witness_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/witness_optimized_probe.py)
          test "$witness_normal_hash1" = "$witness_normal_hash77"
          test "$witness_normal_hash1" = "$witness_optimized_hash1"
          test "$witness_normal_hash1" = "$witness_optimized_hash77"
          phase_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/phase_optimized_probe.py)
          phase_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/phase_optimized_probe.py)
          phase_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/phase_optimized_probe.py)
          phase_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/phase_optimized_probe.py)
          test "$phase_normal_hash1" = "$phase_normal_hash77"
          test "$phase_normal_hash1" = "$phase_optimized_hash1"
          test "$phase_normal_hash1" = "$phase_optimized_hash77"
          continuity_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/continuity_optimized_probe.py)
          continuity_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/continuity_optimized_probe.py)
          continuity_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/continuity_optimized_probe.py)
          continuity_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/continuity_optimized_probe.py)
          test "$continuity_normal_hash1" = "$continuity_normal_hash77"
          test "$continuity_normal_hash1" = "$continuity_optimized_hash1"
          test "$continuity_normal_hash1" = "$continuity_optimized_hash77"
          calibration_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/calibration_optimized_probe.py)
          calibration_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/calibration_optimized_probe.py)
          calibration_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/calibration_optimized_probe.py)
          calibration_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/calibration_optimized_probe.py)
          test "$calibration_normal_hash1" = "$calibration_normal_hash77"
          test "$calibration_normal_hash1" = "$calibration_optimized_hash1"
          test "$calibration_normal_hash1" = "$calibration_optimized_hash77"
          calibration_v2_normal_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python tests/calibration_v2_optimized_probe.py)
          calibration_v2_normal_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python tests/calibration_v2_optimized_probe.py)
          calibration_v2_optimized_hash1=$(PYTHONHASHSEED=1 uv run --frozen --no-sync python -O tests/calibration_v2_optimized_probe.py)
          calibration_v2_optimized_hash77=$(PYTHONHASHSEED=77 uv run --frozen --no-sync python -O tests/calibration_v2_optimized_probe.py)
          test "$calibration_v2_normal_hash1" = "$calibration_v2_normal_hash77"
          test "$calibration_v2_normal_hash1" = "$calibration_v2_optimized_hash1"
          test "$calibration_v2_normal_hash1" = "$calibration_v2_optimized_hash77"
      - name: Verify exact source freeze
        run: |
          LC_ALL=C git ls-files | LC_ALL=C sort | grep -vx SOURCE_SHA256SUMS.txt > "$RUNNER_TEMP/tracked-files.txt"
          sed 's/^[0-9a-f]\{64\}  //' SOURCE_SHA256SUMS.txt > "$RUNNER_TEMP/manifest-files.txt"
          diff -u "$RUNNER_TEMP/tracked-files.txt" "$RUNNER_TEMP/manifest-files.txt"
          sha256sum --check SOURCE_SHA256SUMS.txt
      - name: Build and check packages
        run: |
          umask 022
          export SOURCE_DATE_EPOCH=315532800
          export PYTHONHASHSEED=0
          build_one="$RUNNER_TEMP/build-one"
          build_two="$RUNNER_TEMP/build-two"
          mkdir "$build_one" "$build_two" dist
          uv run --frozen --no-sync python -m build --no-isolation --outdir "$build_one"
          uv run --frozen --no-sync python .github/scripts/normalize_sdist.py "$build_one"/*.tar.gz
          uv run --frozen --no-sync python -m build --no-isolation --outdir "$build_two"
          uv run --frozen --no-sync python .github/scripts/normalize_sdist.py "$build_two"/*.tar.gz
          test "$(find "$build_one" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$build_two" -maxdepth 1 -type f | wc -l)" -eq 2
          cmp "$build_one"/*.whl "$build_two"/*.whl
          cmp "$build_one"/*.tar.gz "$build_two"/*.tar.gz
          cp "$build_one"/* dist/
          uv run --frozen --no-sync python -m twine check dist/*
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          mkdir -p "$RUNNER_TEMP/wheel-tree" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python -m zipfile -e "$wheel" "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python -m tarfile -e "$sdist" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python .github/scripts/privacy_scan.py "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python .github/scripts/privacy_scan.py "$RUNNER_TEMP/sdist-tree"
      - name: Test source distribution without network access
        run: |
          sdist_root=$(find "$RUNNER_TEMP/sdist-tree" -mindepth 1 -maxdepth 1 -type d -print -quit)
          cd "$sdist_root"
          sha256sum --check SOURCE_SHA256SUMS.txt
          export PYTHONPATH="$sdist_root/src"
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from pathlib import Path; import causalfrontier; actual = Path(causalfrontier.__file__).resolve(); expected = (Path.cwd() / "src").resolve(); assert actual.is_relative_to(expected), (actual, expected)'
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --disable-socket --allow-unix-socket
      - name: Installed-wheel smoke
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          expected_version=$(uv run --frozen --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$("$RUNNER_TEMP/wheel-venv/bin/causalfrontier" --version)" = "causalfrontier $expected_version"
          "$RUNNER_TEMP/wheel-venv/bin/causalfrontier" preflight-sentinel-phase-bound-admission --help
          "$RUNNER_TEMP/wheel-venv/bin/causalfrontier" preflight-calibration-v2-view --help
          "$RUNNER_TEMP/wheel-venv/bin/causalfrontier" analyze examples/synthetic-aggregate
          "$RUNNER_TEMP/wheel-venv/bin/causalfrontier" compile examples/synthetic-aggregate "$RUNNER_TEMP/capsule"
          "$RUNNER_TEMP/wheel-venv/bin/causalfrontier" verify "$RUNNER_TEMP/capsule"

  source-manifest:
    name: Exact source freeze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact tracked set and hashes
        run: |
          LC_ALL=C git ls-files | LC_ALL=C sort | grep -vx SOURCE_SHA256SUMS.txt > "$RUNNER_TEMP/tracked-files.txt"
          sed 's/^[0-9a-f]\{64\}  //' SOURCE_SHA256SUMS.txt > "$RUNNER_TEMP/manifest-files.txt"
          diff -u "$RUNNER_TEMP/tracked-files.txt" "$RUNNER_TEMP/manifest-files.txt"
          sha256sum --check SOURCE_SHA256SUMS.txt
