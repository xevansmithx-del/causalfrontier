[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "causalfrontier"
version = "0.1.0a1"
description = "Structural pre-alpha compiler for frozen causal-world discrimination plans"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Evan Smith"}]
keywords = [
  "bioinformatics",
  "causal-models",
  "experimental-design",
  "provenance",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
  "setuptools>=77,<85",
  "twine>=5,<7",
  "wheel>=0.45,<1",
]

[project.scripts]
causalfrontier = "causalfrontier.cli:main"

[project.urls]
Homepage = "https://github.com/xevansmithx-del/causalfrontier"
Repository = "https://github.com/xevansmithx-del/causalfrontier"
Issues = "https://github.com/xevansmithx-del/causalfrontier/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4", "RUF"]
